name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier que le code compile
        run: python -m compileall -q src app tests
      - name: Tests (les tests qui exigent la base sont ignorés en CI)
        run: python -m pytest -q
